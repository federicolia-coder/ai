services:
  runtime:
    build: .
    ports:
      - "8000:8000"
    environment:
      - RUNTIME_HOST=0.0.0.0
      - RUNTIME_PORT=8000
      - RUNTIME_SECRET=${RUNTIME_SECRET}
      - MODEL_PATH=/app/model/weights/qwen2.5-1.5b-instruct-q4_k_m.gguf
      - MAX_CONCURRENT_REQUESTS=1
      - MAX_CONTEXT_LENGTH=2048
      - MAX_GENERATION_LENGTH=512
      - MAX_TOOL_CALLS=3
      - TOOL_TIMEOUT=20
      - WEB_SEARCH_API_KEY=${WEB_SEARCH_API_KEY}
      - WEB_SEARCH_PROVIDER=${WEB_SEARCH_PROVIDER:-brave}
    volumes:
      - ./runtime/model/weights:/app/model/weights:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3G
