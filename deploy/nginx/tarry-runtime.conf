# Nginx site for the Tarry runtime on a VPS where nginx already owns ports 80/443.
# Install: copy to /etc/nginx/sites-available/tarry-runtime, link into sites-enabled,
# then `certbot --nginx -d 85-155-151-119.sslip.io` adds the HTTPS server block.
server {
    listen 80;
    listen [::]:80;
    server_name 85-155-151-119.sslip.io;

    # Up to 5 attachments are sent base64-encoded inside the JSON body.
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Answers stream token by token (server-sent events): never buffer them.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
